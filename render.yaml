services:
  - type: web
    name: smartmeal-ai
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./ai-service/Dockerfile
    dockerContext: ./ai-service
    healthCheckPath: /health

  - type: web
    name: smartmeal-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: smartmeal-ai
          property: host
      - key: AI_SERVICE_CONNECT_TIMEOUT_MS
        value: "10000"
      - key: AI_SERVICE_READ_TIMEOUT_MS
        value: "60000"
