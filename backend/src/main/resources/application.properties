spring.application.name=smartmeal
server.port=${PORT:8080}
spring.profiles.default=local

# Local default profile uses H2 so developers can run without MySQL configured.
# For MySQL/Aiven in development or production, set DB_URL, DB_USERNAME, and DB_PASSWORD in the environment.
spring.datasource.url=${DB_URL:jdbc:h2:mem:smartmeal;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:sa}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

spring.h2.console.enabled=false

jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.booking.cutoff-minutes=${BOOKING_CUTOFF_MINUTES:30}

# Optional AI service endpoint used by future integrations.
ai.service.url=${AI_SERVICE_URL:http://localhost:5001}
ai.service.connect-timeout-ms=${AI_SERVICE_CONNECT_TIMEOUT_MS:2000}
ai.service.read-timeout-ms=${AI_SERVICE_READ_TIMEOUT_MS:4000}

spring.jpa.defer-datasource-initialization=true
